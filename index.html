<script>
    // Initialize Supabase Client (Replace with your keys when ready)
    const SUPABASE_URL = 'https://vgzymkfrtdqizytadyjf.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnenlta2ZydGRxaXp5dGFkeWpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNDQ2OTUsImV4cCI6MjEwNzcyMDY5NX0.4oB5zoF8SBVlN_4p3bATAt78c41z39KeqJaPyFt1_l0';
    
    let supabaseClient = null;
    try {
        if (SUPABASE_URL !== 'YOUR_SUPABASE_PROJECT_URL') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch (e) {
        console.warn('Supabase not initialized yet:', e);
    }

    let revenueChartInstance = null;

    // Load Clients from Supabase (or fallback gracefully)
    async function loadClientsData() {
        if (!supabaseClient) {
            console.log('Using mock client data until Supabase keys are configured.');
            return;
        }
        try {
            const { data: clients, error } = await supabaseClient
                .from('clients')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            document.getElementById('active-clients-count').innerText = clients.length;

            const tableBody = document.getElementById('client-table-body');
            tableBody.innerHTML = '';

            clients.forEach(client => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-blue-50/50 cursor-pointer transition-colors';
                row.setAttribute('onclick', `openClientDetail('${client.business_name}', '${client.industry}', '${client.qbo_tier}')`);
                
                row.innerHTML = `
                    <td class="px-6 py-4 font-semibold text-gray-900">${client.business_name}</td>
                    <td class="px-6 py-4 text-gray-600">${client.industry}</td>
                    <td class="px-6 py-4 text-gray-600">${client.qbo_tier}</td>
                    <td class="px-6 py-4"><span class="bg-green-100 text-green-700 text-xs px-2.5 py-1 rounded-full font-medium">${client.sync_status || 'Active Sync'}</span></td>
                    <td class="px-6 py-4 text-right text-blue-600 font-medium">View File &rarr;</td>
                `;
                tableBody.appendChild(row);
            });
        } catch (err) {
            console.error('Error fetching clients from Supabase:', err.message);
        }
    }

    // Handle Client Onboarding Form
    async function handleClientOnboarding(event) {
        event.preventDefault();
        
        const businessName = document.getElementById('onboard-name').value;
        const industry = document.getElementById('onboard-industry').value;
        const qboTier = document.getElementById('onboard-tier').value;
        const email = document.getElementById('onboard-email').value;

        if (!supabaseClient) {
            alert('Please configure your Supabase URL and Anon Key in index.html to save new clients.');
            return;
        }

        const { error } = await supabaseClient
            .from('clients')
            .insert([{ business_name: businessName, industry: industry, qbo_tier: qboTier, client_email: email, sync_status: 'Pending OAuth' }]);

        if (error) {
            alert('Error saving client: ' + error.message);
        } else {
            alert('Client profile created in Supabase successfully!');
            document.getElementById('onboard-form').reset();
            switchTab('clients');
            loadClientsData();
        }
    }

    // Robust Tab Switching Function
    function switchTab(tabId) {
        ['dashboard', 'clients', 'client-detail', 'filings', 'onboard'].forEach(v => {
            const el = document.getElementById(`view-${v}`);
            if(el) el.classList.add('hidden');
        });

        ['dashboard', 'clients', 'filings', 'onboard'].forEach(n => {
            const btn = document.getElementById(`nav-${n}`);
            if(btn) {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('hover:bg-slate-800', 'hover:text-white');
            }
        });

        const targetView = document.getElementById(`view-${tabId}`);
        if(targetView) targetView.classList.remove('hidden');

        if(['dashboard', 'clients', 'filings', 'onboard'].includes(tabId)) {
            const activeBtn = document.getElementById(`nav-${tabId}`);
            if(activeBtn) {
                activeBtn.classList.remove('hover:bg-slate-800', 'hover:text-white');
                activeBtn.classList.add('bg-blue-600', 'text-white');
            }
        }

        const titles = {
            'dashboard': 'Firm Overview Dashboard',
            'clients': 'Client Roster & Accounts',
            'client-detail': 'Client Financial File & Tax Prep',
            'filings': 'Compliance Filings & Audit Center',
            'onboard': 'Onboard New Business Client'
        };
        const headerEl = document.getElementById('header-title');
        if(headerEl) headerEl.innerText = titles[tabId] || 'CPA Portal';

        if(tabId === 'dashboard' && !revenueChartInstance) {
            initChart();
        }
    }

    function openClientDetail(name, profile, tier) {
        document.getElementById('detail-name').innerText = name;
        document.getElementById('detail-badge').innerText = profile;
        document.getElementById('detail-tier').innerText = tier;
        switchTab('client-detail');
    }

    function initChart() {
        const canvas = document.getElementById('revenueChart');
        if(!canvas) return;
        const ctx = canvas.getContext('2d');
        revenueChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                datasets: [
                    { label: 'Revenue ($)', data: [110000, 125000, 118000, 129900], backgroundColor: '#2563eb', borderRadius: 6 },
                    { label: 'Expenses ($)', data: [82000, 91000, 85000, 94000], backgroundColor: '#94a3b8', borderRadius: 6 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } },
                scales: { y: { beginAtZero: true }, x: { grid: { display: false } } }
            }
        });
    }

    // Initialize on window load safely
    window.onload = () => {
        initChart();
        loadClientsData();
    };
</script>
